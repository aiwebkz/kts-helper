    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN || '''');

          '
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
        persist-credentials: false
    - name: Configure kts-helper server and branding
      shell: bash
      run: python3 kts/configure.py
    - name: Install build runtime
      run: "brew install llvm create-dmg\n# pkg-config is handled in a separate step, because it may be already installed\
        \ by `macos-latest`(14.7.1) runner\nif command -v pkg-config &>/dev/null; then\n    echo \"pkg-config is already installed\"\
        \nelse\n    brew install pkg-config\nfi\n"
    - name: Install NASM
      run: '# Install NASM 2.16.x from official release.

        # Do NOT use `brew install nasm` which installs NASM 3.x.

        # NASM 3.x is a complete rewrite with incompatible CLI options and removed features.

        # aom and other multimedia libraries require NASM 2.x for x86/x86_64 assembly.

        wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip

        unzip nasm-2.16.03-macosx.zip

        sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm

        nasm --version

        '
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_MACOS_ARM_VERSION || env.FLUTTER_VERSION }}
    - name: Keep CocoaPods for Flutter 3.44 (arm64)
