        \  echo \"MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}\" >> \"$GITHUB_ENV\"\nfi\n./build.py --flutter --hwcodec --unix-file-copy-paste\
        \ ${{ matrix.job.extra-build-args }}\n"
    - name: Package unsigned macOS client
      shell: bash
      run: 'set -euo pipefail

        mkdir -p kts/dist

        APP=flutter/build/macos/Build/Products/Release/kts-helper.app

        cp LICENCE "$APP/Contents/Resources/LICENCE"

        cp kts/NOTICE.txt "$APP/Contents/Resources/NOTICE.txt"

        create-dmg --volname "kts-helper" --icon "kts-helper.app" 200 190 --hide-extension "kts-helper.app" --window-size
        800 400 --app-drop-link 600 185 "kts/dist/kts-helper-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg" "$APP"

        python3 kts/package_source.py

        python3 kts/checksums.py'
    - name: Upload kts-helper artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: kts-helper-${{ matrix.job.target }}
        path: kts/dist/*
        if-no-files-found: error
        retention-days: 14
