name: kts-helper
services:
  hbbs:
    image: rustdesk/rustdesk-server:1.1.16
    command: ["hbbs", "-r", "${RELAY_HOST:?Set RELAY_HOST in .env}:21117", "-k", "_"]
    network_mode: host
    volumes:
      - ./data:/root
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  hbbr:
    image: rustdesk/rustdesk-server:1.1.16
    command: ["hbbr", "-k", "_"]
    network_mode: host
    volumes:
      - ./data:/root
    restart: unless-stopped
    depends_on:
      hbbs:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
